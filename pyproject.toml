[project]
name = "wizard"
version = "0.1.0"
description = "Weekly Insights on Zealous Art and Release Details"
readme = "README.md"
authors = [
    { name = "DevSmapy", email = "lyk456@naver.com" },
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
]

[project.scripts]
wizard = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_processor"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"templates/movie_card.html" = "templates/movie_card.html"
"templates/top_index.html" = "templates/top_index.html"
